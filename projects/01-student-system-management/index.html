<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result</h1>

        <form id="resultForm">

            <label>Student Name</label>
	    <input type="text" id="name" required><br><br>

            <label>Roll Number</label>
	    <input type="number" id="roll" required><br><br>

            <label>Department</label>
            <select id="department">
                <option>IT</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
	    </select><br><br>

            <label>Java Mark</label>
	    <input type="number" id="java" min="0" max="100" required><br><br>

            <label>DBMS Mark</label>
	    <input type="number" id="dbms" min="0" max="100" required><br><br>

            <label>DSA Mark</label>
	    <input type="number" id="dsa" min="0" max="100" required><br><br>

            <label>Web Mark</label>
	    <input type="number" id="web" min="0" max="100" required><br><br>

            <label>Maths Mark</label>
	    <input type="number" id="maths" min="0" max="100" required><br><br>

	    <button type="submit">Calculate Result</button><br><br>

        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
